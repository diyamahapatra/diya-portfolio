  <title>Sandbox — Diya Mahapatra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&family=Spectral:ital,wght@0,200;0,300;0,400;1,300&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --orange: #8B5CF6;
      --black:  #0F0F0F;
      --gray:   #6B7280;
      --border: #E5E7EB;
      --ease:   cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    html, body {
      width: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #FAF9F7;
      color: var(--black);
    }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 40px; height: 57px;
      border-bottom: 1px solid var(--border);
      background: rgba(250,249,247,0.92);
      backdrop-filter: blur(12px);
    }
    .nav-logo {
      display: flex; align-items: center; gap: 8px;
      font-size: 15px; font-weight: 600;
      text-decoration: none; color: var(--black);
      transition: transform 0.2s var(--ease);
      transform-origin: left center;
    }
    .nav-logo:hover { transform: scale(1.06); }
    .nav-links { list-style: none; display: flex; gap: 32px; }
    .nav-links a {
      font-size: 14px; color: var(--gray);
      text-decoration: none; transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--black); }
    .nav-links a.active { color: var(--black); font-weight: 500; }

    /* ── VIDEO GRID ──
       Two even columns of looping videos, measured off the reference at 1440:
       619 × 376 tiles with 10px gaps in a 1248px column (96px margins). Each
       video sits whole in its tile on the page colour; videos only play while
       they're on screen. */
    .visual { max-width: 1296px; margin: 0 auto; padding: 73px 24px 0; }
    .visual-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .vtile {
      position: relative; aspect-ratio: 619 / 376;
      background: #FAF9F7; border: 1px solid #E8E5E0; overflow: hidden;
    }
    .vtile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }

    /* ── HOVER TAG ──
       Over the photos and the loop the pointer becomes a small black dot that
       stretches into a rounded label and types its words in. The outer box
       follows the pointer and leans with speed (JS); the face inside does the
       stretching (CSS). */
    .hover-tag {
      position: fixed; left: 0; top: 0; width: 0; height: 0;
      z-index: 300; pointer-events: none;
      opacity: 0; transition: opacity .15s;
    }
    .hover-tag.on { opacity: 1; }
    .tag-face {
      position: absolute; left: 0; top: 0;
      width: 14px; height: 14px; margin: -7px 0 0 -7px;   /* collapsed: a tile centred on the pointer */
      box-sizing: border-box;
      background: rgba(15, 15, 15, 0.62); color: #fff;   /* see-through enough to keep the image visible behind it */
      border-radius: 15px;                    /* fully round: a dot when collapsed, a pill when open */
      font-size: 13px; font-weight: 500; line-height: 1; white-space: nowrap;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      transition: width .34s cubic-bezier(.34, 1.3, .64, 1), height .34s cubic-bezier(.34, 1.3, .64, 1),
                  margin .34s cubic-bezier(.34, 1.3, .64, 1);
    }
    .tag-face.open { height: 30px; margin-top: -15px; }
    .tag-text .ch { display: inline-block; white-space: pre; animation: tagType .22s var(--ease) both; }
    @keyframes tagType {
      from { opacity: 0; filter: blur(4px); transform: translateY(3px); }
      to   { opacity: 1; filter: none; transform: none; }
    }
    .has-tag { cursor: none; }
    @media (prefers-reduced-motion: reduce) {
      .tag-face { transition: none; }
    }

    /* ── FOOTER ── */
    .site-footer {
      --footer-accent: #8B5CF6;
      background: #FAF9F7;
      border-top: 1px solid var(--border);
      padding: 80px 96px 56px;
      margin-top: 48px;
    }

    /* ── FOOTER SCRATCH-OFF ──
       Three stacked layers: the colour sits underneath, a white canvas covers
       it, and the real footer content rides on top. Moving the pointer erases
       into the canvas, so you wipe the colour into view. The canvas never
       takes pointer events, so links stay clickable and touch still scrolls.
       Kept identical on every page — this footer is shared furniture. */
    .site-footer { position: relative; overflow: hidden; }
    .footer-inner { position: relative; z-index: 2; }
    .footer-reveal {
      position: absolute; inset: 0; z-index: 0;
      pointer-events: none;
      /* violet only, and deliberately pale: the footer text sits over this and
         has to stay readable even when the whole thing is wiped clear */
      background:
        radial-gradient(70% 90% at 12% 18%, #C4B5FD 0%, rgba(196,181,253,0) 64%),
        radial-gradient(65% 85% at 88% 12%, #DDD6FE 0%, rgba(221,214,254,0) 60%),
        radial-gradient(85% 95% at 62% 105%, #A78BFA 0%, rgba(167,139,250,0) 64%),
        linear-gradient(125deg, #F5F3FF 0%, #EDE9FE 100%);
    }
    .footer-veil {
      position: absolute; inset: 0; z-index: 1;
      pointer-events: none;
      display: block;
    }
    @media (prefers-reduced-motion: reduce) {
      .footer-reveal, .footer-veil { display: none; }
    }
    .footer-inner { max-width: 1000px; margin: 0 auto; }
    .footer-heading {
      font-family: 'Lora', serif;
      font-size: clamp(28px, 3.2vw, 44px);
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.08;
      color: var(--black);
      margin-bottom: 34px;
    }
    /* Reachable by assistive tech, invisible on screen. Used to give the
       footer heading a stable accessible name while the typewriter runs. */
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }
    .footer-word { color: var(--footer-accent); font-family: 'Inter', sans-serif; }
    .footer-caret {
      display: inline-block;
      color: var(--footer-accent);
      font-weight: 300;
      animation: caretBlink 0.8s step-end infinite;
      margin-left: 1px;
    }
    @keyframes caretBlink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .footer-caret { animation: none; } }
    .footer-main {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 40px; margin-bottom: 56px;
    }
    .footer-left { display: flex; flex-direction: column; }
    .footer-links { display: flex; flex-direction: column; gap: 6px; }
    .footer-link {
      font-size: 14px; font-weight: 400;
      color: var(--gray); text-decoration: none;
      transition: color 0.18s;
    }
    .footer-link:hover { color: var(--black); }
    .footer-nav {
      display: flex; flex-direction: column; align-items: flex-end;
      gap: 8px; padding-top: 8px;
    }
    .footer-nav-link {
      font-size: 13px; font-weight: 400;
      color: var(--gray); text-decoration: none;
      transition: color 0.18s;
    }
    .footer-nav-link:hover { color: var(--black); }
    .footer-bottom {
      display: flex; align-items: center; justify-content: space-between;
      border-top: 1px solid var(--border);
      padding-top: 24px;
    }
    .footer-copy { font-size: 12px; color: var(--gray); }

    /* ── MOBILE ── */
    @media (max-width: 900px) {
      nav { padding: 0 18px; }
      .nav-links { gap: 18px; }
      .nav-links a { font-size: 13px; }

      .visual { padding: 73px 16px 0; }
      .visual-grid { grid-template-columns: 1fr; }
      .site-footer { padding: 56px 20px 40px; margin-top: 40px; }
      img { max-width: 100%; height: auto; }
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-logo" href="/"><img src="images/purpmiffy.png" alt="miffy" style="width:22px;height:22px;object-fit:contain;display:block;">diya</a>
    <ul class="nav-links">
      <li><a href="/#projects">Work</a></li>
      <li><a href="/about">About</a></li>
      <li><a href="/sandlot" class="active">Sandbox</a></li>
      <li><a href="Diya-Mahapatra-Product-Designer-Resume.pdf" target="_blank">Resume</a></li>
    </ul>
  </nav>

  <main class="visual">
    <h1 class="sr-only">Sandbox: motion and interaction experiments</h1>
    <div class="visual-grid">
      <div class="vtile" data-label="puzzle loop · motion">
        <video src="videos/puzzle-loop.mp4" poster="images/puzzle-loop-poster.jpg" muted loop playsinline preload="metadata" aria-label="A single tile morphing through Wordle, a mini crossword, sudoku, Connections and a jigsaw"></video>
      </div>
      <div class="vtile" data-label="moonlight · motion">
        <video src="videos/moonlight.mp4" poster="images/moonlight-poster.jpg" muted loop playsinline preload="metadata" aria-label="A film countdown that becomes a star rating and the Moonlight poster"></video>
      </div>
      <div class="vtile" data-label="hop board · interaction">
        <video src="videos/hop-board.mp4" poster="images/hop-board-poster.jpg" muted loop playsinline preload="metadata" aria-label="A bunny hopping between tiles on a grid, following the cursor"></video>
      </div>
      <div class="vtile" data-label="word row · interaction">
        <video src="videos/word-row.mp4" poster="images/word-row-poster.jpg" muted loop playsinline preload="metadata" aria-label="A row of tiles typing and revealing words"></video>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-reveal" aria-hidden="true"></div>
    <canvas class="footer-veil" aria-hidden="true"></canvas>
    <div class="footer-inner">
      <div class="footer-main">
        <div class="footer-left">
          <h2 class="footer-heading">Let's build something<br><span class="footer-word" id="footer-word" aria-hidden="true">together</span><span class="footer-caret" aria-hidden="true">|</span><span class="sr-only"> together</span></h2>
          <div class="footer-links">
            <a class="footer-link" href="mailto:diyamahapatra@berkeley.edu">email</a>
            <a class="footer-link" href="https://www.linkedin.com/in/diya-mahapatra/" target="_blank">linkedIn</a>
            <a class="footer-link" href="Diya-Mahapatra-Product-Designer-Resume.pdf" target="_blank">resume</a>
          </div>
        </div>
        <div class="footer-nav">
          <a class="footer-nav-link" href="/#projects">Work</a>
          <a class="footer-nav-link" href="/sandlot">Sandbox</a>
          <a class="footer-nav-link" href="Diya-Mahapatra-Product-Designer-Resume.pdf" target="_blank">Resume</a>
        </div>
      </div>
      <div class="footer-bottom">
        <p class="footer-copy">© 2026 Diya Mahapatra</p>
        <p class="footer-copy">made with thai iced tea 🧋 · designed on Figma, coded with Claude Code</p>
      </div>
    </div>
  </footer>

  <script>

    /* ── VIDEO TILES ──
       Each loop plays while at least a quarter of it is on screen and pauses
       otherwise, so only the visible ones cost anything. With reduced motion
       they stay on their posters. */
    (function () {
      var vids = Array.prototype.slice.call(document.querySelectorAll('.vtile video'));
      if (!vids.length || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      if (!('IntersectionObserver' in window)) { vids.forEach(function (v) { v.play().catch(function () {}); }); return; }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) { if (e.isIntersecting) e.target.play().catch(function () {}); else e.target.pause(); });
      }, { threshold: 0.25 });
      vids.forEach(function (v) { io.observe(v); });
    })();

    /* ── HOVER TAG ──
       Mouse: the tag replaces the cursor inside each video tile and
       trails it on a short spring, leaning with horizontal speed; the rAF loop
       only runs while the tag is showing or settling. Touch: a tap shows it
       where you tapped for a moment. Reduced motion: no typing or lean. */
    (function () {
      var targets = Array.prototype.slice.call(document.querySelectorAll('.vtile')).map(function (el) {
        return { el: el, text: el.getAttribute('data-label') };
      });
      if (!targets.length) return;
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      var tag = document.createElement('div');
      tag.className = 'hover-tag';
      tag.setAttribute('aria-hidden', 'true');
      tag.innerHTML = '<div class="tag-face"><span class="tag-text"></span></div>';
      document.body.appendChild(tag);
      var face = tag.firstChild, label = face.firstChild;
      var measure = document.createElement('canvas').getContext('2d');

      var x = 0, y = 0, tx = 0, ty = 0, lean = 0, w = 14, showing = false, raf = null, timers = [], hideTimer = null;

      function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
      function clearTimers() { timers.forEach(clearTimeout); timers = []; }

      /* keep the label on screen: it grows rightward from the pointer, or leftward near the edge */
      function side() {
        if (!face.classList.contains('open')) return;
        face.style.marginLeft = (x + w > window.innerWidth - 12 ? -(w - 7) : -7) + 'px';
      }
      function open(text) {
        clearTimers();
        label.textContent = '';
        measure.font = '500 13px Inter, system-ui, sans-serif';
        w = Math.ceil(measure.measureText(text).width) + 26;   // 13px padding a side for the pill ends
        face.style.width = w + 'px';
        face.classList.add('open');
        side();
        if (reduced) { label.textContent = text; return; }
        text.split('').forEach(function (ch, i) {
          later(function () {
            var c = document.createElement('span');
            c.className = 'ch'; c.textContent = ch;
            label.appendChild(c);
          }, 90 + i * 24);
        });
      }
      function close() {
        clearTimers();
        label.textContent = '';
        face.classList.remove('open');
        face.style.width = ''; face.style.marginLeft = '';
        showing = false;
        tag.classList.remove('on');
      }

      function frame() {
        var k = reduced ? 1 : 0.3, dx = tx - x;
        x += dx * k; y += (ty - y) * k;
        lean += ((reduced ? 0 : Math.max(-6, Math.min(6, dx * 0.15))) - lean) * 0.2;
        tag.style.transform = 'translate(' + x + 'px,' + y + 'px) rotate(' + lean + 'deg)';
        side();
        if (showing || Math.abs(dx) > 0.2 || Math.abs(lean) > 0.05) raf = requestAnimationFrame(frame);
        else raf = null;
      }
      function show(e, text) {
        tx = e.clientX; ty = e.clientY;
        if (!showing) { x = tx; y = ty; lean = 0; }   // appear under the pointer, not trailing in from the last spot
        showing = true;
        tag.classList.add('on');
        open(text);
        if (!raf) raf = requestAnimationFrame(frame);
      }

      targets.forEach(function (t) {
        t.el.classList.add('has-tag');
        t.el.addEventListener('pointerenter', function (e) {
          if (e.pointerType === 'mouse') { clearTimeout(hideTimer); show(e, t.text); }
        });
        t.el.addEventListener('pointermove', function (e) {
          if (e.pointerType === 'mouse') { tx = e.clientX; ty = e.clientY; }
        });
        t.el.addEventListener('pointerleave', function (e) {
          if (e.pointerType === 'mouse') close();
        });
        /* no hover on touch: a tap shows the tag where you tapped, briefly */
        t.el.addEventListener('pointerdown', function (e) {
          if (e.pointerType === 'mouse') return;
          clearTimeout(hideTimer);
          show(e, t.text);
          hideTimer = setTimeout(close, 1800);
        });
      });
    })();

    /* ── FOOTER WORD CYCLER ── */
    (function() {
      const words = ['together', 'great', 'magical', 'inspiring'];
      const el = document.getElementById('footer-word');
      if (!el) return;
      let wi = 0, charI = words[0].length, deleting = false;
      const TYPE_SPEED = 80, DELETE_SPEED = 45, PAUSE_AFTER = 1800, PAUSE_BEFORE = 220;
      function tick() {
        const current = words[wi];
        if (deleting) {
          charI--;
          el.textContent = current.slice(0, charI);
          if (charI === 0) { deleting = false; wi = (wi + 1) % words.length; setTimeout(tick, PAUSE_BEFORE); return; }
          setTimeout(tick, DELETE_SPEED);
        } else {
          charI++;
          el.textContent = words[wi].slice(0, charI);
          if (charI === words[wi].length) { setTimeout(() => { deleting = true; tick(); }, PAUSE_AFTER); return; }
          setTimeout(tick, TYPE_SPEED);
        }
      }
      setTimeout(() => { deleting = true; tick(); }, PAUSE_AFTER);
    })();
  
    /* ── FOOTER SCRATCH-OFF ──
       Erases into a white canvas as the pointer moves, then heals back so the
       next visitor gets a clean slate. The rAF loop only runs while there is
       something to heal, so an idle footer costs nothing. */
    (function () {
      var footer = document.querySelector('.site-footer');
      var canvas = footer && footer.querySelector('.footer-veil');
      if (!canvas) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      var ctx = canvas.getContext('2d');
      var w = 0, h = 0, raf = null, idleFrames = 0, last = null;
      var RADIUS = 52, HEAL = 0.030, IDLE_STOP = 260;

      function fillVeil() {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#FAF9F7';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
      }

      function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var r = footer.getBoundingClientRect();
        w = r.width; h = r.height;
        if (!w || !h) return;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        fillVeil();
        last = null;
      }

      function hole(x, y) {
        var g = ctx.createRadialGradient(x, y, 0, x, y, RADIUS);
        g.addColorStop(0, 'rgba(0,0,0,0.60)');
        g.addColorStop(0.65, 'rgba(0,0,0,0.28)');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, RADIUS, 0, Math.PI * 2);
        ctx.fill();
      }

      function wipe(x, y) {
        ctx.globalCompositeOperation = 'destination-out';
        if (last) {
          /* interpolate, or a fast flick leaves a dotted trail instead of a stroke */
          var dx = x - last.x, dy = y - last.y;
          var steps = Math.max(1, Math.ceil(Math.sqrt(dx * dx + dy * dy) / 14));
          for (var i = 1; i <= steps; i++) hole(last.x + dx * i / steps, last.y + dy * i / steps);
        } else {
          hole(x, y);
        }
        last = { x: x, y: y };
        idleFrames = 0;
        start();
      }

      function frame() {
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(250,249,247,' + HEAL + ')';
        ctx.fillRect(0, 0, w, h);
        idleFrames++;
        if (idleFrames > IDLE_STOP) { fillVeil(); raf = null; return; }
        raf = requestAnimationFrame(frame);
      }

      function start() { if (raf === null) raf = requestAnimationFrame(frame); }

      footer.addEventListener('pointermove', function (e) {
        var r = footer.getBoundingClientRect();
        wipe(e.clientX - r.left, e.clientY - r.top);
      }, { passive: true });

      /* re-entering elsewhere shouldn't drag a streak across the whole footer */
      footer.addEventListener('pointerleave', function () { last = null; });
      footer.addEventListener('pointerdown', function (e) {
        var r = footer.getBoundingClientRect();
        last = null;
        wipe(e.clientX - r.left, e.clientY - r.top);
      }, { passive: true });

      resize();
      if ('ResizeObserver' in window) new ResizeObserver(resize).observe(footer);
      else window.addEventListener('resize', resize);
    })();
</script>
</body>
</html>
